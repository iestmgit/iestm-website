<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IESTM | انتخاب زبان / Choose Language</title>
  <meta name="description" content="انتخاب زبان وب‌سایت رسمی کمپانی ایستم | Choose your language for IESTM official website" />
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" hreflang="fa" href="index-fa.html" />
  <link rel="alternate" hreflang="en" href="index-en.html" />
  <link rel="alternate" hreflang="x-default" href="index.html" />

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .selector-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 50px 45px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: fadeScale 0.6s ease;
    }
    @keyframes fadeScale {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .selector-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 24px;
      border: 3px solid #ffd700;
      display: block;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
    }
    .selector-title {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .selector-sub {
      color: #ffd700;
      font-size: 1.05rem;
      margin-bottom: 32px;
    }
    .selector-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .selector-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 60px;
      padding: 18px 30px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: inherit;
    }
    .selector-btn:hover {
      background: rgba(255, 215, 0, 0.15);
      border-color: #ffd700;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.2);
    }
    .selector-btn:active {
      transform: scale(0.97);
    }
    .selector-flag {
      font-size: 2rem;
      line-height: 1;
    }
    .selector-footer {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      margin-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }
    @media (max-width: 500px) {
      .selector-box { padding: 35px 22px; }
      .selector-title { font-size: 1.6rem; }
      .selector-btn { padding: 15px 22px; font-size: 1.1rem; }
      .selector-flag { font-size: 1.6rem; }
    }
  </style>
</head>
<body class="noise">

  <div class="selector-box">
    <img src="logo.jpg" alt="IESTM Logo" class="selector-logo" onerror="this.style.display='none'">
    <h1 class="selector-title">IESTM</h1>
    <p class="selector-sub">🌐 انتخاب زبان / Choose Language</p>

    <div class="selector-buttons">
      <button class="selector-btn" onclick="chooseLanguage('fa')">
        <span class="selector-flag">🇮🇷</span> فارسی
      </button>
      <button class="selector-btn" onclick="chooseLanguage('en')">
        <span class="selector-flag">🇬🇧</span> English
      </button>
    </div>

    <p class="selector-footer">کمپانی ایستم — IESTM Company</p>
  </div>

  <script>
    function chooseLanguage(lang) {
      localStorage.setItem('preferred_lang', lang);
      window.location.href = 'index-' + lang + '.html';
    }

    // اگر کاربر قبلاً زبان را انتخاب کرده، مستقیم به صفحه اصلی برود
    document.addEventListener('DOMContentLoaded', function () {
      const saved = localStorage.getItem('preferred_lang');
      if (saved === 'fa' || saved === 'en') {
        window.location.href = 'index-' + saved + '.html';
      }
    });
  </script>
</body>
</html>
