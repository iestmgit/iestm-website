<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IESTM | تماس با ما</title>
  <meta name="description" content="راه‌های ارتباطی با کمپانی ایستم" />
  <link rel="icon" type="image/jpeg" href="https://upload.wikimedia.org/wikipedia/commons/c/c7/%D8%A7%DB%8C%D8%B3%D8%AA%D9%85.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" hreflang="fa" href="contact.html" />
  <link rel="alternate" hreflang="en" href="contact-en.html" />
  
  <style>
    body { font-family: "Yekan", "Vazirmatn", "Tahoma", sans-serif !important; }
    .lang-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; justify-content: center; align-items: center;
      z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease;
      opacity: 1; visibility: visible;
    }
    .lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .glass-box {
      background: rgba(255, 255, 255, 0.10); border-radius: 40px; padding: 50px 55px;
      max-width: 520px; width: 92%; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      animation: fadeScale 0.5s ease;
    }
    @keyframes fadeScale { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
    .lang-title { color: #fff; font-size: 1.9rem; margin-bottom: 25px; text-shadow: 0 2px 12px rgba(0,0,0,0.4); font-weight: 600; }
    .lang-buttons { display: flex; flex-direction: row; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 60px; padding: 16px 38px; font-size: 1.4rem; font-weight: 600;
      color: #fff; cursor: pointer; transition: all 0.3s ease;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
      display: flex; align-items: center; gap: 12px; font-family: inherit;
    }
    .lang-btn:hover { background: rgba(255, 255, 255, 0.30); transform: scale(1.06); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.40); border-color: rgba(255, 255, 255, 0.60); }
    .lang-btn:active { transform: scale(0.94); }
    .flag-icon { font-size: 2.1rem; line-height: 1; }
    .lang-note { color: rgba(255, 255, 255, 0.55); font-size: 0.85rem; margin-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 16px; }
    @media (max-width: 600px) { .glass-box { padding: 30px 18px; } .lang-title { font-size: 1.3rem; } .lang-btn { padding: 14px 20px; font-size: 1.1rem; gap: 8px; } .flag-icon { font-size: 1.7rem; } }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; color: white; font-family: "Yekan", sans-serif; }
    @media (max-width:980px){ .contact-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="noise">

<div id="langOverlay" class="lang-overlay">
  <div class="glass-box">
    <h1 class="lang-title">🌐 انتخاب زبان / Choose Language</h1>
    <div class="lang-buttons">
      <button class="lang-btn" onclick="setLanguage('fa')"><span class="flag-icon">🇮🇷</span> فارسی</button>
      <button class="lang-btn" onclick="setLanguage('en')"><span class="flag-icon">🇬🇧</span> English</button>
    </div>
    <p class="lang-note">این انتخاب فقط یک بار انجام می‌شود / This choice is made only once</p>
  </div>
</div>

<div id="header-placeholder"></div>

<main>
  <section class="container">
    <div class="section-title">
      <h2>ارتباط با ما</h2>
      <p>راه‌های ارتباطی برای همکاری، سوالات و پیشنهادات</p>
    </div>
    <div class="contact-grid">
      <div class="glass" style="padding:30px;">
        <h3 style="color:var(--gold);">اطلاعات تماس</h3>
        <p><strong>📧 ایمیل:</strong> asly3325@gmail.com</p>
        <p><strong>📞 تلفن:</strong> 09398212260</p>
        <p><strong>📱 کانال تلگرام:</strong> @iestmcompany</p>
        <p><strong>👤 بنیان‌گذار:</strong> رادمهر اصغری</p>
      </div>
      <div class="glass" style="padding:30px;">
        <h3 style="color:var(--gold);">ارسال پیام</h3>
        <form id="contactForm">
          <input type="text" id="name" placeholder="نام و نام خانوادگی">
          <input type="email" id="email" placeholder="ایمیل">
          <textarea id="message" rows="4" placeholder="پیام شما..."></textarea>
          <button type="submit" class="btn btn-primary" style="width:100%;">ارسال پیام</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="js/load-components.js"></script>
<script>
  document.getElementById('contactForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    if(name) alert(`✅ پیام شما دریافت شد.\n${name} عزیز، به زودی پاسخ داده می‌شود.`);
    else alert('❌ لطفاً نام خود را وارد کنید.');
    this.reset();
  });

  function setLanguage(lang) {
    localStorage.setItem('preferred_lang', lang);
    const overlay = document.getElementById('langOverlay');
    overlay.classList.add('hidden');
    setTimeout(() => {
      const currentPath = window.location.pathname;
      const currentPage = currentPath.substring(currentPath.lastIndexOf('/') + 1) || 'contact.html';
      let targetPage;
      if (lang === 'en') {
        if (currentPage === 'contact.html' || currentPage === '') targetPage = 'contact-en.html';
        else { const base = currentPage.replace('.html', ''); targetPage = base + '-en.html'; }
      } else {
        if (currentPage === 'contact-en.html') targetPage = 'contact.html';
        else if (currentPage.includes('-en.')) targetPage = currentPage.replace('-en.html', '.html');
        else targetPage = currentPage;
      }
      if (targetPage !== currentPage && targetPage !== '') window.location.href = targetPage;
      else location.reload();
    }, 500);
  }
  document.addEventListener('DOMContentLoaded', function() {
    const overlay = document.getElementById('langOverlay');
    const saved = localStorage.getItem('preferred_lang');
    if (saved) overlay.classList.add('hidden');
    else overlay.classList.remove('hidden');
  });
</script>
</body>
</html>
