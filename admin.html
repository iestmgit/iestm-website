<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IESTM | پنل مدیریت</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="https://upload.wikimedia.org/wikipedia/commons/c/c7/%D8%A7%DB%8C%D8%B3%D8%AA%D9%85.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-box { max-width: 500px; margin: 0 auto; padding: 30px; }
    .admin-tabs { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
    .admin-tab { padding: 10px 24px; background: rgba(255,255,255,.05); border-radius: 30px; cursor: pointer; }
    .admin-tab.active { background: var(--gold); color: #07111f; }
    .admin-panel { display: none; }
    .admin-panel.active-panel { display: block; }
    .news-item { background: rgba(255,255,255,.05); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .del-btn { padding: 8px 16px; background: rgba(255,79,163,.2); border: none; border-radius: 20px; color: var(--pink); cursor: pointer; }
  </style>
</head>
<body class="noise">

<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/%D8%A7%DB%8C%D8%B3%D8%AA%D9%85.jpg" alt="IESTM"></div>
      <div>پنل مدیریت</div>
    </div>
    <div class="nav-links">
      <a href="index.html">خانه</a>
      <a href="about.html">درباره ما</a>
      <a href="projects.html">پروژه‌ها</a>
      <a href="blog.html">اخبار</a>
      <a href="music.html">آهنگ رسمی</a>
      <a href="contact.html">تماس</a>
    </div>
  </div>
</nav>

<main>
  <section class="container">
    <div class="section-title">
      <h2>پنل مدیریت</h2>
      <p>ورود به بخش مدیریت (فقط برای مدیران)</p>
    </div>
    <div id="adminApp"></div>
  </section>
</main>

<script>
  const validUsername = 'iestmkar';
  const validPassword = 'rm123456rm';
  let isLoggedIn = localStorage.getItem('iestmAdmin') === 'true';
  const defaultNews = [
    { id:1, date:"۱۴۰۳/۱۰/۱۵", title:"رونمایی از محیط دسکتاپ IESTM OS نسخه آلفا", summary:"اولین نسخه آزمایشی محیط دسکتاپ ویندوزی ایستم منتشر شد.", badge:"جدید" },
    { id:2, date:"۱۴۰۳/۱۰/۱۰", title:"بروزرسانی بزرگ IESTM Notebook 1.5", summary:"نسخه جدید دفترچه یادداشت با تم تاریک منتشر شد.", badge:"بروزرسانی" },
    { id:3, date:"۱۴۰۳/۱۰/۰۵", title:"جذب برنامه‌نویس برای تیم توسعه IESTM", summary:"کمپانی ایستم از علاقه‌مندان دعوت می‌کند.", badge:"استخدام" }
  ];
  function getNews() { return JSON.parse(localStorage.getItem('iestm_news') || JSON.stringify(defaultNews)); }
  function saveNews(news) { localStorage.setItem('iestm_news', JSON.stringify(news)); }
  function render() {
    const container = document.getElementById('adminApp');
    if(!container) return;
    if(!isLoggedIn) {
      container.innerHTML = `<div class="glass admin-box"><input type="text" id="user" class="admin-input" placeholder="نام کاربری"><input type="password" id="pass" class="admin-input" placeholder="رمز عبور"><button class="btn btn-primary" onclick="login()" style="width:100%">ورود</button><div id="msg" class="small" style="margin-top:16px;text-align:center"></div></div>`;
    } else {
      const news = getNews();
      container.innerHTML = `<div class="glass" style="padding:30px"><div class="admin-tabs"><div class="admin-tab active" onclick="switchTab('news')">مدیریت اخبار</div><div class="admin-tab" onclick="switchTab('add')">افزودن خبر</div></div><div id="newsPanel" class="admin-panel active-panel"><div id="newsList"></div></div><div id="addPanel" class="admin-panel"><input type="text" id="newsDate" class="admin-input" placeholder="تاریخ"><input type="text" id="newsTitle" class="admin-input" placeholder="عنوان"><textarea id="newsSummary" class="admin-textarea" placeholder="متن خبر"></textarea><input type="text" id="newsBadge" class="admin-input" placeholder="برچسب"><button class="btn btn-primary" onclick="addNews()">افزودن خبر</button></div><button class="logout-btn" onclick="logout()" style="margin-top:30px">خروج</button></div>`;
      renderNewsList();
    }
  }
  function renderNewsList() {
    const container = document.getElementById('newsList');
    if(!container) return;
    const news = getNews();
    if(news.length===0) { container.innerHTML='<p>هیچ خبری نیست</p>'; return; }
    container.innerHTML = news.map(n => `<div class="news-item"><div><strong>${n.title}</strong><br><small>${n.date} | ${n.badge}</small></div><button class="del-btn" onclick="deleteNews(${n.id})">حذف</button></div>`).join('');
  }
  function addNews() {
    const date = document.getElementById('newsDate')?.value, title = document.getElementById('newsTitle')?.value, summary = document.getElementById('newsSummary')?.value, badge = document.getElementById('newsBadge')?.value;
    if(!date||!title||!summary||!badge) { alert('همه فیلدها پر شود'); return; }
    const news = getNews();
    news.unshift({ id:Date.now(), date, title, summary, badge });
    saveNews(news);
    alert('خبر اضافه شد');
    document.getElementById('newsDate').value=''; document.getElementById('newsTitle').value=''; document.getElementById('newsSummary').value=''; document.getElementById('newsBadge').value='';
    renderNewsList();
  }
  function deleteNews(id) { let news = getNews(); news = news.filter(n=>n.id!==id); saveNews(news); renderNewsList(); }
  function switchTab(tab) { document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active')); event.target.classList.add('active'); document.getElementById('newsPanel').classList.remove('active-panel'); document.getElementById('addPanel').classList.remove('active-panel'); if(tab==='news') document.getElementById('newsPanel').classList.add('active-panel'); else document.getElementById('addPanel').classList.add('active-panel'); }
  function login() { const u=document.getElementById('user')?.value, p=document.getElementById('pass')?.value; if(u===validUsername && p===validPassword) { isLoggedIn=true; localStorage.setItem('iestmAdmin','true'); render(); } else { const m=document.getElementById('msg'); if(m) m.innerHTML='<span style="color:var(--pink)">نام کاربری یا رمز اشتباه</span>'; } }
  function logout() { isLoggedIn=false; localStorage.removeItem('iestmAdmin'); render(); }
  render();
</script>
</body>
</html>
