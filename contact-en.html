<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IESTM | Contact Us</title>
  <meta name="description" content="Contact IESTM Company – collaboration, questions, and suggestions." />
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" hreflang="fa" href="contact-fa.html" />
  <link rel="alternate" hreflang="en" href="contact-en.html" />
  <link rel="alternate" hreflang="x-default" href="index.html" />
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="container">
      <div class="section-title">
        <h2>Contact Us</h2>
        <p>Ways to reach us for collaboration, questions, and suggestions</p>
      </div>
      <div class="contact-grid">
        <div class="glass" style="padding:30px;">
          <h3 style="color:#ffd700;">Contact Information</h3>
          <p style="margin-top:12px;"><strong>📧 Email:</strong> asly3325@gmail.com</p>
          <p><strong>📞 Phone:</strong> 09398212260</p>
          <p><strong>📱 Telegram Channel:</strong> @iestmcompany</p>
          <p><strong>👤 Founder:</strong> Radmehr Asghari</p>
        </div>
        <div class="glass" style="padding:30px;">
          <h3 style="color:#ffd700;">Send a Message</h3>
          <form id="contactForm">
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email">
            <textarea id="message" rows="4" placeholder="Your message..."></textarea>
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/load-components.js"></script>
  <script>
    document.getElementById('contactForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      if (name) alert('✅ Your message has been received.\nDear ' + name + ', we will respond soon.');
      else alert('❌ Please enter your name.');
      this.reset();
    });
  </script>
</body>
</html>
