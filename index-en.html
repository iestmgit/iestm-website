<head>
  <meta charset="UTF-8" />

  <title>IESTM | Home – Web Software, Game & Desktop App Development</title>
  <meta name="description" content="IESTM Company, managed by Radmehr Asghari – specializing in web software development, 3D browser games, and Python desktop applications." />
  <link rel="icon" type="image/jpeg" href="https://upload.wikimedia.org/wikipedia/commons/c/c7/%D8%A7%DB%8C%D8%B3%D8%AA%D9%85.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" hreflang="fa" href="index.html" />
  <link rel="alternate" hreflang="en" href="index-en.html" />
  
  <style>
    body { font-family: "Yekan", "Vazirmatn", "Tahoma", sans-serif !important; }
    
    /* ===== استایل‌های اورلی ===== */
    .lang-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; justify-content: center; align-items: center;
      z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease;
      opacity: 1; visibility: visible;
    }
    .lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .glass-box {
      background: rgba(255, 255, 255, 0.10); border-radius: 40px; padding: 50px 55px;
      max-width: 520px; width: 92%; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      animation: fadeScale 0.5s ease;
    }
    @keyframes fadeScale { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
    .lang-title { color: #fff; font-size: 1.9rem; margin-bottom: 25px; text-shadow: 0 2px 12px rgba(0,0,0,0.4); font-weight: 600; }
    .lang-buttons { display: flex; flex-direction: row; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 60px; padding: 16px 38px; font-size: 1.4rem; font-weight: 600;
      color: #fff; cursor: pointer; transition: all 0.3s ease;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
      display: flex; align-items: center; gap: 12px; font-family: inherit;
    }
    .lang-btn:hover { background: rgba(255, 255, 255, 0.30); transform: scale(1.06); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.40); border-color: rgba(255, 255, 255, 0.60); }
    .lang-btn:active { transform: scale(0.94); }
    .flag-icon { font-size: 2.1rem; line-height: 1; }
    .lang-note { color: rgba(255, 255, 255, 0.55); font-size: 0.85rem; margin-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 16px; }
    @media (max-width: 600px) { .glass-box { padding: 30px 18px; } .lang-title { font-size: 1.3rem; } .lang-btn { padding: 14px 20px; font-size: 1.1rem; gap: 8px; } .flag-icon { font-size: 1.7rem; } }

    .products-preview, .news-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px; margin-bottom: 30px;
    }
    .product-card, .news-card {
      padding: 24px; border-radius: 22px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      transition: 0.3s;
    }
    .product-card:hover, .news-card:hover {
      transform: translateY(-5px); border-color: var(--gold);
    }
    .tag {
      display: inline-block; margin: 6px 8px 0 0; padding: 7px 12px;
      border-radius: 999px; background: rgba(255,255,255,.07); font-size: .88rem;
    }
    .news-date { font-size: .8rem; color: var(--gold); margin-bottom: 12px; }
    .news-badge {
      display: inline-block; margin-top: 16px; padding: 6px 12px;
      border-radius: 20px; background: rgba(247,201,72,.15); color: var(--gold); font-size: .75rem;
    }
    .quote { padding: 32px; text-align: center; font-size: 1.15rem; color: #fff5cf; margin: 40px 0; }
    .footer-box {
      display: grid; grid-template-columns: 2fr 1fr 1fr;
      gap: 20px; padding: 26px; background: rgba(255,255,255,.03); border-radius: 24px;
    }
    .product-card a { color: inherit; text-decoration: none; }
    .product-card a:hover { color: var(--gold); }
    @media (max-width: 640px) {
      .products-preview, .news-grid { grid-template-columns: 1fr; }
      .footer-box { grid-template-columns: 1fr; }
    }
  </style>
</head>

</div>
